election_title: "Stats for Nerds — Bloc STAR: the Equal Support histogram must change with the seat"

scenario_description: |-
  Ten voters, five candidates, two seats, counted by Bloc STAR. Built for the
  BetterVoting "Stats for Nerds" dropdown on multi-winner results: every widget
  that depends on the finalist pair has to be re-drawn per seat.

  Real ballots (8) plus two FLAT ballots: one that gives everybody 3 stars and
  one that gives everybody 0. The flat ballots express no preference in any
  matchup, so they sit in the Equal Support bucket of EVERY seat.

    - Seat 1: scores Ava 34, Ben 28, Cara 22, Dan 16, Eli 12 (LH count, flat
      ballots included; BetterVoting drops the two flat ballots as abstentions
      and shows Ava 31, Ben 25, Cara 19, Dan 13, Eli 9 — same order, each total
      3 lower). Ava and Ben advance; Ava beats Ben 4-2, Equal Support 4.
    - Seat 2: Ava is removed. Ben 28 and Cara 22 advance; Ben beats Cara 4-2,
      Equal Support 4.

  Same Equal Support COUNT in both seats (4 of 10), but a different SHAPE:
    - Seat 1 (Ava vs Ben): equal at 5 stars (1 ballot), 4 stars (1),
      3 stars (the flat-3 ballot), 0 stars (the flat-0 ballot).
    - Seat 2 (Ben vs Cara): equal at 2 stars (1), 1 star (1), 3 stars (flat-3),
      0 stars (flat-0).
  A histogram still wired to roundResults[0] would draw the seat-1 shape under
  the seat-2 result. The two flat ballots are the constant: they must appear in
  the 3-star and 0-star bars of both seats.

  Five candidates give the Head-to-Head Matchups list ten pairs, so it scrolls.
  No tie-break is used anywhere in this election.

  BetterVoting caveats to watch: (a) the flat ballots are excluded from
  nTallyVotes (nAbstentions 2, nTallyVotes 8) but STAREqualPreferencesWidget
  reads every ballot that carries a score, so the flat-3 ballot still lands in
  the histogram — the histogram total (4) can exceed the runoff's Equal Support
  count (2); (b) the flat-0 ballot only reaches the histogram if the zeros are
  stored as 0 rather than null. Create the election with public results so the
  page opens without admin rights.

options:
  show_description: false
  show_matrix: true
  matrix_finalists_only: false
  show_condorcet: true
  show_score_counts: true
  show_irv: false
  show_runoff_percent: true
  brief: true
  collapse_ballots: false
  count_separator: "×"

num_winners: 2
voting_method: Bloc STAR
ballots: |-
  Ava,Ben,Cara,Dan,Eli
  5,5,2,1,0
  4,4,1,2,0
  5,2,2,0,1
  4,1,1,3,0
  5,3,1,2,4
  4,2,3,1,0
  3,5,4,0,2
  1,3,5,4,2
  3,3,3,3,3
  0,0,0,0,0

expected_winners:
  - Ava
  - Ben

